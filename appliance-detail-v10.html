<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#071520"><title>Appliance 1.1 · Eldoret</title><style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#061522;color:#f1f8ff;font:15px/1.35 system-ui,-apple-system,sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-2;background:url('/eldoret-appliances.jpg') center/cover no-repeat}body:after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(90deg,#061522e6 0%,#061522a0 53%,#06152216 100%)}header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 15px;background:#071b2ce8;border-bottom:1px solid #72b7ce55}header strong{font-size:20px;letter-spacing:.09em}header small{display:block;font-size:10px;letter-spacing:.13em;color:#b9d7e5}.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}button,a{font:inherit;color:inherit}button,.tools a{padding:9px 13px;border:1px solid #6ba8bc;border-radius:9px;background:#18576c;text-decoration:none;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:default}#checked{font-size:11px;color:#b4cedc}main{padding:12px 15px;display:grid;gap:10px;max-width:1600px;margin:auto}.hero,.detail{width:min(900px,70%);border:1px solid #7cb0c75c;border-radius:13px;background:#071e30b8;padding:13px 16px}.hero{display:flex;justify-content:space-between;align-items:center;gap:12px}.ey{font-size:10px;font-weight:800;letter-spacing:.14em;color:#9de2db}h1{font-size:clamp(25px,3.2vw,40px);margin:3px 0}h3{font-size:16px;margin:8px 0}.hc-subtitle{font-size:12px;color:#b9cfda;margin:4px 0}.readout{text-align:right}.readout strong{display:block;font-size:clamp(20px,2.5vw,32px);margin-top:5px}.pill{font-size:11px;font-weight:800;display:inline-block;padding:5px 9px;border:1px solid #7597a7;border-radius:20px;color:#d4e4ee}.pill[data-state=good]{color:#a9f3cf;border-color:#52ae87;background:#134d3d}.readout [data-state=active]{color:#ffdb58}.readout [data-state=bad]{color:#ff9292}.hc-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.hc-tabs button{background:#16384bd9;font-size:13px;padding:8px 11px}.hc-tabs button[aria-selected=true]{background:#22616b;border-color:#8be1e1}.hc-pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:0}.hc-pair{border:1px solid #6b9cb34a;border-radius:8px;padding:8px 10px;background:#12364b91;min-width:0}.hc-pair dt{font-size:11px;color:#b8cedb}.hc-pair dd{font-size:16px;font-weight:750;margin:3px 0 0;overflow-wrap:anywhere}.hc-notice,.hc-event{padding:9px 10px;background:#15364b99;border-radius:8px;color:#cee1eb;font-size:12px}.hc-event{display:flex;justify-content:space-between;gap:10px;margin:4px 0}.hc-action{margin:4px;font-size:12px}.foot{font-size:11px;color:#c1d8e5;margin:0}.detail{min-height:0}.hc-details-view{min-height:0;overflow:auto;max-height:calc(100dvh - 225px)}@media(display-mode:standalone){header{padding-top:max(32px,calc(env(safe-area-inset-top,0px) + 8px))}.hc-details-view{max-height:calc(100dvh - 260px)}}@media(max-width:800px){.hero,.detail{width:100%}header{flex-wrap:wrap}.tools a,.tools button{font-size:12px;padding:7px}}@media(max-width:520px){.hero{align-items:flex-start;flex-wrap:wrap}.readout{text-align:left}.hc-details-view{max-height:none}.hc-pairs{grid-template-columns:1fr}.tools{width:100%}}
</style></head><body><header><div><strong>ELDORET · APPLIANCE 1.1</strong><small>HOME CONNECT · MONITORING</small></div><div class="tools"><span id="checked">Checking…</span><button id="pageRefresh">↻ REFRESH</button><a href="appliance-menu.html">APPLIANCES</a><a href="nerd-control.html">⌂ NERD CENTRAL</a></div></header><main><section class="hero"><div><div class="ey">LIVE APPLIANCE STATUS</div><h1 id="hcDialogTitle">Appliance</h1><p class="hc-subtitle" id="hcDialogSubtitle">Checking connection…</p></div><div class="readout"><span class="pill" id="connection">CHECKING</span><strong id="operating">—</strong></div></section><section class="detail"><nav class="hc-tabs" aria-label="Appliance details"><button data-tab="overview" aria-selected="true">Overview</button><button data-tab="programmes" aria-selected="false">Programmes</button><button data-tab="settings" aria-selected="false">Settings</button><button data-tab="activity" aria-selected="false">Activity</button><button data-tab="controls" aria-selected="false">Controls</button></nav><div class="hc-details-view" id="hcDetailContent" aria-live="polite">Loading appliance data from Bulldog…</div></section><p class="foot">Monitoring only · reported values from Home Connect · no remote appliance activation</p></main><script>
(()=>{const $=id=>document.getElementById(id);const chosen=new URLSearchParams(location.search).get("name");let busy=false,current=null,currentTab='overview',currentDetail=null,latest=[],events=[];
const states={Inactive:'Idle',Ready:'Ready',Run:'Running',Finished:'Finished',Pause:'Paused',DelayedStart:'Scheduled',Error:'Attention needed'};
const fmt=v=>typeof v==='string'?v.split('.').pop():String(v);
const label=k=>String(k).replace(/([a-z])([A-Z])/g,'$1 $2').replace(/_/g,' ');
const add=(p,tag,txt,cls)=>{const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=txt;p.append(e);return e;};
const mins=n=>typeof n==='number'?Math.floor(n/3600)+'h '+Math.floor(n%3600/60)+'m':'—';
const value=v=>typeof v==='boolean'?(v?'Yes':'No'):v===null||v===undefined?'—':typeof v==='string'?fmt(v):String(v);
function pair(parent,name,v){const wrap=add(parent,'div','','hc-pair');add(wrap,'dt',name);add(wrap,'dd',value(v));}
function render(result){
 const devices=Array.isArray(result.devices)?result.devices:[];
 latest=devices;events=Array.isArray(result.events)?result.events:[];
 const next=devices.find(d=>d.name===chosen);
 $('checked').textContent=result.checked_at?'Source checked '+new Date(result.checked_at).toLocaleTimeString('en-GB'):'Source time unavailable';
 if(!next){current=null;$('connection').textContent='DATA UNAVAILABLE';$('connection').dataset.state='unknown';$('operating').textContent='Unknown';$('operating').dataset.state=''; $('hcDialogSubtitle').textContent='No live data';$('hcDetailContent').textContent=result.error||'No current reading for this appliance.';return;}
 const initial=!current;current=next;drawDetail();if(initial&&['programmes','settings'].includes(currentTab))loadDetail();
}
function close(){location.href='appliance-menu.html';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
document.querySelectorAll('.hc-tabs button').forEach(button=>button.addEventListener('click',()=>{
 currentTab=button.dataset.tab;drawDetail();if(['programmes','settings'].includes(currentTab))loadDetail();
}));
async function loadDetail(){if(!current)return;const name=current.name;
 try{const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),18000);
  let r;try{r=await fetch('/api/home-connect/details?name='+encodeURIComponent(name),{cache:'no-store',signal:ctl.signal});}
  finally{clearTimeout(timer);}
  if(!r.ok)throw Error();const result=await r.json();if(current&&current.name===name){currentDetail=result;drawDetail();}
 }catch(_){if(current&&current.name===name){currentDetail={error:'Details temporarily unavailable'};drawDetail();}}}
function drawDetail(){if(!current)return;const d=current,s=d.status||{},out=$('hcDetailContent');out.replaceChildren();$('connection').textContent=d.connected?'CONNECTED':'UNAVAILABLE';$('connection').dataset.state=d.connected?'good':'unknown';$('operating').textContent=d.connected?(states[fmt(s.OperationState)]||fmt(s.OperationState||'Unknown')):'Unknown';$('operating').dataset.state=fmt(s.OperationState)==='Run'?'active':fmt(s.OperationState)==='Error'?'bad':'';
 $('hcDialogTitle').textContent=d.name;$('hcDialogSubtitle').textContent=[d.brand,d.model,d.connected?'Connected':'Offline'].filter(Boolean).join(' · ');
 document.querySelectorAll('.hc-tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===currentTab?'true':'false'));
 if(currentTab==='overview'){
   const grid=add(out,'dl','','hc-pairs');
   pair(grid,'Operating state',states[fmt(s.OperationState)]||fmt(s.OperationState||'Unknown'));
   pair(grid,'Active programme',d.active_program?fmt(d.active_program):'None');
   for(const [key,v] of Object.entries(s))if(key!=='OperationState')pair(grid,label(key),v);
   for(const option of d.program_options||[])pair(grid,label(option.key),/RemainingProgramTime|RemainingTime/i.test(option.key)?mins(option.value):option.value);
   return;
 }
 if(currentTab==='activity'){
  add(out,'p','Changes recorded by Bulldog while the Home Connect integration is running.','hc-notice');
  const records=events.filter(e=>e.name===d.name).slice(-40).reverse();
  if(!records.length){add(out,'p','No recorded changes yet. Activity begins when Bulldog observes a state transition.');return;}
  const list=add(out,'div','','hc-history');
  for(const event of records){const line=add(list,'div','','hc-event');add(line,'span',event.event+' · '+event.value);add(line,'time',new Date(event.at).toLocaleString('en-GB'));}
  return;
 }
 if(currentTab==='controls'){
  add(out,'p','Control is currently disabled. We have authorised monitoring only. Starting an oven, hob, dishwasher or hood remotely is not enabled.','hc-notice');
  for(const text of ['Start','Pause / resume','Stop','Change programme']){const b=add(out,'button',text,'hc-action');b.disabled=true;b.type='button';}
  add(out,'p','If control is added later, Eldoret will show only actions supported by that specific appliance, with clear confirmation and appropriate safety restrictions.','hc-subtitle');return;
 }
 if(!currentDetail){add(out,'p','Loading available options from Home Connect…');return;}
 if(currentDetail.error){add(out,'p',currentDetail.error,'hc-notice');return;}
 if(currentTab==='programmes'){
  const selected=currentDetail.selected_program;
  add(out,'h3','Selected programme');
  add(out,'p',selected?fmt(selected):'No selected programme reported');
  const program=add(out,'dl','','hc-pairs');
  for(const opt of currentDetail.selected_options||[])pair(program,label(opt.name),opt.value);
  add(out,'h3','Available programmes');
  const names=currentDetail.available_programs||[];
  if(!names.length)add(out,'p','Home Connect did not report selectable programmes at this time.');
  else {const grid=add(out,'div','','hc-pairs');for(const p of names)pair(grid,'Programme',label(p.name));}
  add(out,'p','Programme selection and starting are disabled in monitoring mode.','hc-notice');return;
 }
 if(currentTab==='settings'){
  add(out,'h3','Reported settings');
  const settings=currentDetail.settings||[];
  if(!settings.length)add(out,'p','Settings are not exposed under current monitoring-only permissions. Additional authorisation would be required.');
  else {const grid=add(out,'dl','','hc-pairs');for(const entry of settings)pair(grid,label(entry.name),entry.value);}
  add(out,'p','Settings are read-only. Some information is available only when the appliance is powered on or running.','hc-notice');
 }
}
async function refresh(){if(busy)return;busy=true;$('pageRefresh').disabled=true;const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),20000);
 try{const r=await fetch('/api/home-connect/status',{cache:'no-store',signal:ctrl.signal});if(!r.ok)throw Error();render(await r.json());}
 catch(_){$('connection').textContent='DATA UNAVAILABLE';$('connection').dataset.state='unknown';$('operating').textContent='Last reading';$('operating').dataset.state='';$('checked').textContent='Refresh failed';$('hcDialogSubtitle').textContent='Home Connect is temporarily unavailable';if(!current)$('hcDetailContent').textContent='Try Refresh.';}
 finally{clearTimeout(timer);$('pageRefresh').disabled=false;busy=false;}}
$('pageRefresh').addEventListener('click',refresh);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
$('hcDialogTitle').textContent=chosen||'Appliance';if(['Left Oven','Right Oven','Hob','Hood','Main Kitchen Dishwasher','Back Kitchen Dishwasher'].includes(chosen)){refresh();setInterval(()=>{if(!document.hidden)refresh();},60000);}else{$('hcDetailContent').textContent='Choose an appliance from the appliance menu.';$('pageRefresh').disabled=true;}
})();

</script><script src="kiosk.js?v=3"></script></body></html>
