<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071621"><title>Bulldog · Heartbeat 1.3</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071621;color:#e9f5f9;font:12px system-ui,-apple-system,sans-serif}
#app{width:100vw;height:100dvh;display:grid;grid-template-rows:34px 37px minmax(0,1fr) 15px;gap:5px;padding:7px 9px;background:radial-gradient(ellipse at 50% 0%,#143245,#071621 90%)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:16px;letter-spacing:.12em}header small{display:block;font-size:9px;color:#edcfa5;letter-spacing:.12em;font-weight:800}
.right{display:flex;gap:12px;align-items:baseline}.right .chapter{font-size:12px;color:#a1f1db;font-weight:800}.right #clock{font-weight:900;font-size:22px}
#alertbar{border:1px solid #a2766865;background:#261a25ab;border-radius:7px;padding:5px 9px;display:flex;gap:8px;min-width:0;align-items:center}
#alertbar strong{font-size:10px;color:#f4d6ab;white-space:nowrap}#alerts{white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:11px;color:#eaccc7}
#shell{min-height:0;position:relative;overflow:hidden;border-radius:7px}#view{border:0;width:100%;height:100%;display:block;pointer-events:none;background:transparent}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#0b2331;color:#bed3dc}#loading[hidden]{display:none}
footer{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#a7c7cd;font-size:9px}#info{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pips{display:flex;gap:5px}.pip{height:4px;width:23px;border-radius:5px;background:#344f5d}.pip.on{background:#8cf0ca}
</style></head><body><div id="app"><header><div><strong>ELDORET · BULLDOG</strong><small>HEARTBEAT · OPERATIONS MONITOR 1.3</small></div><div class="right"><span class="chapter" id="chapter">INFRASTRUCTURE</span><span id="clock">--:--</span></div></header>
<div id="alertbar"><strong>● HOME ALERTS</strong><span id="alerts">Connecting to Nerd Central…</span></div>
<div id="shell"><iframe id="view" src="/nerd-control.html?bulldog-view=1" title="Live Nerd Central in display-only mode" tabindex="-1"></iframe><div id="loading">Loading the same live Nerd Central dashboard…</div></div>
<footer><span id="info">Read-only · no touch required · updates automatically</span><div class="pips"><i class="pip on"></i><i class="pip"></i><i class="pip"></i></div></footer></div><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),frame=$('view');
const pages = [
  {title: 'INFRASTRUCTURE', artwork: '/eldoret-network.jpg', columns: [
    ['INTERNET & WI-FI'], ['BULLDOG · LIVE HEALTH']
  ]},
  {title: 'HOUSE & COMFORT', artwork: '/eldoret-house-night.webp', columns: [
    ['TELEVISIONS', 'LIGHTING · HUE'],
    ['APPLIANCES · HOME CONNECT', 'VELUX · CLIMATE']
  ]},
  {title: 'ENERGY & ENTERTAINMENT', artwork: '/eldoret-ariya.jpg', columns: [
    ['NISSAN ARIYA', 'PRINTER · HOUSE DEVICES'],
    ['AUDIO · PIONEER', 'PLAYSTATION · MEDIA']
  ]}
];
const displayStyles = `
html,body { height:100%!important; margin:0!important; overflow:hidden!important }
body:before { display:none!important }
.shell {
  width:100%!important; max-width:none!important; height:100%!important;
  padding:0!important; margin:0!important; overflow:hidden!important;
}
.top,#holdingTitle,#alertsDock,#statusLegend,#telemetry,#engineeringPanels,
.new-alert-shade,.family-screen,.directory-panel { display:none!important }
#nerdWall {
  display:block!important; position:relative!important; width:100%!important;
  height:100%!important; min-height:0!important; margin:0!important; overflow:hidden!important;
}
.bulldog-slide {
  position:absolute; inset:0; display:none; padding:clamp(8px,1.5vmin,18px);
  grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(12px,4vw,64px);
  isolation:isolate; background:#071621;
}
.bulldog-slide.show { display:grid }
.bulldog-artwork {
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  z-index:0; pointer-events:none;
}
.bulldog-stack { position:relative; z-index:1; display:flex; flex-direction:column; align-items:flex-start; gap:8px; min-width:0 }
.bulldog-stack + .bulldog-stack { align-items:flex-end }
#nerdWall .bulldog-stack .nerd-module {
  width:max-content; max-width:100%; min-height:0; padding:5px 8px;
  border-color:#7399a48c; background:#071521e0; box-shadow:0 2px 12px #020a1170;
}
#nerdWall .bulldog-stack .nerd-module::before,
#nerdWall .bulldog-stack .nerd-module::after { display:none }
#nerdWall .bulldog-stack h3 {
  font-size:clamp(11px,1.45vw,17px); letter-spacing:.045em;
  margin:0 0 2px; padding-bottom:3px;
}
#nerdWall .bulldog-stack h3 a { font-size:inherit }
#nerdWall .bulldog-stack .nerd-row {
  grid-template-columns:7px minmax(0,1fr) minmax(0,max-content)!important;
  gap:5px; min-height:0!important; padding:1px 0;
  font-size:clamp(10px,1.31vw,15px)!important; line-height:1.2;
}
#nerdWall .bulldog-stack .nerd-row b,
#nerdWall .bulldog-stack .nerd-row>span:nth-child(2) {
  font-size:inherit!important; line-height:inherit!important;
  white-space:normal!important; overflow-wrap:anywhere;
}
#nerdWall .bulldog-stack .nerd-row b { max-width:min(31vw,36ch); margin-left:5px }
`;
let ready=false,active=0;
function clock(){$('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function show(i) {
  active = i % pages.length;
  $('chapter').textContent = pages[active].title;
  frame.contentDocument?.querySelectorAll('.bulldog-slide').forEach((slide, j) => {
    slide.classList.toggle('show', j === active);
  });
  document.querySelectorAll('.pip').forEach((pip, j) => pip.classList.toggle('on', j === active));
}
function install() {
  try {
    const doc = frame.contentDocument;
    const wall = doc?.getElementById('nerdWall');
    if (!wall) throw Error('No live wall');
    const style = doc.createElement('style');
    style.textContent = displayStyles;
    doc.head.append(style);

    const cards = new Map([...wall.querySelectorAll(':scope > .nerd-module')]
      .map(card => [card.getAttribute('aria-label'), card]));
    pages.forEach(({title, artwork, columns}) => {
      const slide = doc.createElement('section');
      slide.className = 'bulldog-slide';
      slide.setAttribute('aria-label', title);
      const image = doc.createElement('img');
      image.className = 'bulldog-artwork';
      image.alt = '';
      image.src = artwork;
      slide.append(image);
      for (const names of columns) {
        const stack = doc.createElement('div');
        stack.className = 'bulldog-stack';
        for (const name of names) {
          const card = cards.get(name) ?? (name === 'AUDIO · PIONEER'
            ? cards.get('AUDIO · PIONEER + OTHERS') : undefined);
          if (card) stack.append(card);
        }
        slide.append(stack);
      }
      wall.append(slide);
    });
    for (const card of cards.values()) {
      if (card.parentElement === wall) card.hidden = true;
    }
    ready = true;
    $('loading').hidden = true;
    show(0);
    inspect();
  } catch (_) {
    $('loading').textContent = 'Nerd Central presentation unavailable';
    $('info').textContent = 'Could not read Nerd Central on this host';
  }
}
function inspect(){if(!ready)return;try{const d=frame.contentDocument;
const alerts=[...d.querySelectorAll('#alertsList .alert-item')].map(x=>x.textContent.replace(/^\s*●\s*/,'').trim()).filter(Boolean);
$('alerts').textContent=alerts.length?alerts.join('  ·  '):(d.getElementById('alertCount')?.textContent||'SCANNING');
$('info').textContent=(d.getElementById('health')?.textContent||'Checking live devices')+' · same Nerd Central source';}catch(_){}}
frame.addEventListener('load',install);
clock();setInterval(clock,10000);setInterval(()=>{if(ready)show(active+1)},18000);setInterval(inspect,3000);
setInterval(()=>{ready=false;$('loading').hidden=false;frame.src='/nerd-control.html?bulldog-view=1&t='+Date.now();},900000);
})();
</script></body></html>
