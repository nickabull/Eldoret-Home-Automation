<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1018"><title>Open Eldoret</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 20% 0,#1a2942,#0b1018 42%,#070b11);color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:#121a26;border:1px solid #2a3748;border-radius:28px;padding:30px;box-shadow:0 24px 70px #0008}.ey{color:#73d5b1;letter-spacing:.18em;font-weight:900;font-size:12px}.mark{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#73d5b1,#786fe9);display:grid;place-items:center;font-size:38px;margin-bottom:22px}h1{margin:5px 0 8px;font-size:34px}p{color:#9eacbe;line-height:1.5}.status{margin-top:18px;padding:14px;border-radius:14px;background:#0b111a;border:1px solid #263347}.ok{color:#aaf0d6}</style></head><body><div class="card"><div class="mark">E</div><div class="ey">ELDORET</div><h1>Connecting…</h1><p>Finding the current secure route to Donkey.</p><div class="status" id="status">Checking latest tunnel…</div></div><script>
(async()=>{const s=document.getElementById("status");try{const r=await fetch("remote-url.json?"+Date.now(),{cache:"no-store"});const d=await r.json();if(!d.url)throw 0;s.textContent="Secure route found. Opening Eldoret…";s.className="status ok";setTimeout(()=>location.href=d.url,450)}catch(e){s.textContent="Donkey has not published a remote route yet. Try again in a minute.";}})();
</script></body></html>
