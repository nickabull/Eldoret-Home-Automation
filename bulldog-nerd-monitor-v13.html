<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071621"><title>Bulldog · Heartbeat 1.3</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071621;color:#e9f5f9;font:12px system-ui,-apple-system,sans-serif}
#app{width:100vw;height:100dvh;display:grid;grid-template-rows:34px 37px minmax(0,1fr) 15px;gap:5px;padding:7px 9px;background:radial-gradient(ellipse at 50% 0%,#143245,#071621 90%)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:16px;letter-spacing:.12em}header small{display:block;font-size:9px;color:#edcfa5;letter-spacing:.12em;font-weight:800}
.right{display:flex;gap:12px;align-items:baseline}.right .chapter{font-size:12px;color:#a1f1db;font-weight:800}.right #clock{font-weight:900;font-size:22px}
#alertbar{border:1px solid #a2766865;background:#261a25ab;border-radius:7px;padding:5px 9px;display:flex;gap:8px;min-width:0;align-items:center}
#alertbar strong{font-size:10px;color:#f4d6ab;white-space:nowrap}#alerts{white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:11px;color:#eaccc7}
#shell{min-height:0;position:relative;overflow:hidden;border-radius:7px}#view{border:0;width:100%;height:100%;display:block;pointer-events:none;background:transparent}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#0b2331;color:#bed3dc}#loading[hidden]{display:none}
footer{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#a7c7cd;font-size:9px}#info{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pips{display:flex;gap:5px}.pip{height:4px;width:23px;border-radius:5px;background:#344f5d}.pip.on{background:#8cf0ca}
#app{pointer-events:none;touch-action:none;user-select:none}
</style><style>.ecgStrap{--ecg:#8aa0aa;display:flex;flex:1 1 170px;max-width:310px;min-width:45px;align-items:center;gap:7px;color:var(--ecg);margin:0 4px}.ecgStrap[data-state=healthy]{--ecg:#46ff99}.ecgStrap[data-state=warning]{--ecg:#ffd05b}.ecgStrap[data-state=down]{--ecg:#ff6868}.ecgStrap svg{width:100%;height:30px;min-width:40px;flex:1 1 auto}.ecgStrap .trace{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 3px currentColor);stroke-dasharray:270;stroke-dashoffset:0}.ecgStrap[data-state=healthy] .trace,.ecgStrap[data-state=warning] .trace{animation:ecgSweep 2.8s linear infinite}.ecgStrap small{font:800 9px/1.15 system-ui,sans-serif;white-space:nowrap;color:inherit;letter-spacing:.04em}.ecgStrap .flat{display:none}.ecgStrap[data-state=down] .flat,.ecgStrap[data-state=waiting] .flat{display:block}.ecgStrap[data-state=down] .trace,.ecgStrap[data-state=waiting] .trace{display:none}@keyframes ecgSweep{0%{stroke-dashoffset:270;opacity:.65}100%{stroke-dashoffset:0;opacity:1}}@media(max-width:750px){.ecgStrap{max-width:155px;gap:3px}.ecgStrap small{font-size:8px}.ecgStrap svg{height:24px}}@media(max-width:520px){.ecgStrap small{display:none}}@media(prefers-reduced-motion:reduce){.ecgStrap .trace{animation:none!important}}</style><style>header .ecgStrap{max-width:210px}header .ecgStrap svg{height:24px}header .ecgStrap small{font-size:8px}</style></head><body><div id="app"><header><div><strong>ELDORET · BULLDOG</strong><small>HEARTBEAT · OPERATIONS MONITOR 1.3</small></div><div class="ecgStrap" id="ecgStrap" data-state="waiting" role="status" aria-label="Bulldog health: awaiting data"><svg viewBox="0 0 240 32" preserveAspectRatio="none" aria-hidden="true"><path d="M0 8H240 M0 16H240 M0 24H240 M40 0V32 M80 0V32 M120 0V32 M160 0V32 M200 0V32" fill="none" stroke="currentColor" opacity=".12" stroke-width=".5"/><path class="trace" d="M0 17H30L37 12L44 17H55L60 22L67 3L74 29L81 17H100Q111 8 121 17H151L158 12L165 17H176L181 22L188 3L195 29L202 17H240"/><path class="flat" d="M0 17H240" stroke="currentColor" stroke-width="1.5" fill="none"/></svg><small id="ecgText">AWAITING DATA</small></div><div class="right"><span class="chapter" id="chapter">INFRASTRUCTURE</span><span id="clock">--:--</span></div></header>
<div id="alertbar"><strong>● HOME ALERTS</strong><span id="alerts">Connecting to Nerd Central…</span></div>
<div id="shell"><iframe id="view" src="/nerd-control.html?bulldog-view=1" title="Live Nerd Central in display-only mode" tabindex="-1"></iframe><div id="loading">Loading the same live Nerd Central dashboard…</div></div>
<footer><span id="info">Read-only · no touch required · updates automatically</span><div class="pips"><i class="pip on"></i><i class="pip"></i><i class="pip"></i></div></footer></div><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),frame=$('view');
const groups=[
 ['INTERNET & WI-FI','BULLDOG · LIVE HEALTH'],
 ['TELEVISIONS','APPLIANCES · HOME CONNECT','LIGHTING · HUE','VELUX · CLIMATE'],
 ['NISSAN ARIYA','AUDIO · PIONEER','PLAYSTATION · MEDIA','PRINTER · HOUSE DEVICES']
];
const chapters=['INFRASTRUCTURE','HOUSE & COMFORT','ENERGY & ENTERTAINMENT'];
const cssBase="\nhtml,body{height:100%!important;overflow:hidden!important;margin:0!important}\nbody:before{display:none!important}\n.shell{width:100%!important;max-width:none!important;height:100%!important;padding:0!important;overflow:hidden!important;margin:0!important}\n.top,#holdingTitle,#alertsDock,#statusLegend,#telemetry,#engineeringPanels,.new-alert-shade,.family-screen,.directory-panel{display:none!important}\n#nerdWall{display:block!important;width:100%!important;height:100%!important;min-height:0!important;margin:0!important;overflow:hidden!important;position:relative!important;grid-template-rows:none!important;grid-template-columns:none!important}\n#nerdWall .bulldog-slide{position:absolute!important;inset:0!important;display:none!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(0,1fr))!important;gap:6px!important}\n#nerdWall .bulldog-slide.show{display:grid!important}\n#nerdWall .bulldog-slide>.nerd-module{grid-area:auto!important;min-height:0!important;padding:7px 8px!important;overflow:hidden!important}\n#nerdWall .bulldog-slide>.nerd-module[aria-label=\"TELEVISIONS\"],\n#nerdWall .bulldog-slide>.nerd-module[aria-label=\"APPLIANCES · HOME CONNECT\"]{grid-row:span 2!important}\n#nerdWall .bulldog-slide>.nerd-module .nerd-row{min-height:16px!important;font-size:10px!important}\n#nerdWall .bulldog-slide>.nerd-module .nerd-row b{font-size:10px!important}\n#nerdWall .bulldog-slide>.nerd-module .nerd-row>span:nth-child(2){font-size:10px!important}\n#nerdWall .bulldog-slide>.nerd-module h3{font-size:11px!important}\n#nerdWall .bulldog-slide>.nerd-module[aria-label=\"TELEVISIONS\"] .nerd-row,\n#nerdWall .bulldog-slide>.nerd-module[aria-label=\"APPLIANCES · HOME CONNECT\"] .nerd-row{min-height:26px!important;grid-template-columns:8px minmax(0,.85fr) minmax(0,1.15fr)!important}\n#nerdWall .bulldog-slide>.nerd-module[aria-label=\"TELEVISIONS\"] .nerd-row b,\n#nerdWall .bulldog-slide>.nerd-module[aria-label=\"APPLIANCES · HOME CONNECT\"] .nerd-row b{white-space:normal!important;font-size:9px!important;line-height:1.1!important}\n";
let ready=false,active=0,nextRotation=0,installed=false;
function clock(){$('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function show(i){active=i%3;$('chapter').textContent=chapters[active];const doc=frame.contentDocument;
if(!doc)return;[...doc.querySelectorAll('.bulldog-slide')].forEach((node,j)=>node.classList.toggle('show',j===active));
document.querySelectorAll('.pip').forEach((p,j)=>p.classList.toggle('on',j===active));}
function install(){try{const doc=frame.contentDocument,wall=doc?.getElementById('nerdWall');if(!wall)throw Error('No live wall');
const style=doc.createElement('style');style.textContent=cssBase+"\n#nerdWall .bulldog-slide{gap:7px!important}\n#nerdWall .bulldog-slide.slide-0{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:minmax(0,1fr)!important}\n#nerdWall .bulldog-slide.slide-1{grid-template-columns:repeat(3,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(0,1fr))!important}\n#nerdWall .bulldog-slide.slide-1>.nerd-module:nth-child(1){grid-column:1!important;grid-row:1/span 2!important}\n#nerdWall .bulldog-slide.slide-1>.nerd-module:nth-child(2){grid-column:2!important;grid-row:1/span 2!important}\n#nerdWall .bulldog-slide.slide-1>.nerd-module:nth-child(3){grid-column:3!important;grid-row:1!important}\n#nerdWall .bulldog-slide.slide-1>.nerd-module:nth-child(4){grid-column:3!important;grid-row:2!important}\n#nerdWall .bulldog-slide>.nerd-module{padding:8px!important}\n#nerdWall .bulldog-slide>.nerd-module:after{background:linear-gradient(90deg,#041221eb,#041221af 66%,#04122155)!important}\n#nerdWall .bulldog-slide>.nerd-module h3{font-size:13px!important;letter-spacing:.035em!important;margin-bottom:6px!important}\n#nerdWall .bulldog-slide>.nerd-module h3 a{display:none!important}\n#nerdWall .bulldog-slide>.nerd-module .nerd-row{min-height:20px!important;font-size:12px!important;grid-template-columns:7px minmax(0,1fr) minmax(0,1.15fr)!important;gap:4px!important}\n#nerdWall .bulldog-slide>.nerd-module .nerd-row b,#nerdWall .bulldog-slide>.nerd-module .nerd-row>span:nth-child(2){font-size:inherit!important;white-space:normal!important;overflow-wrap:anywhere!important;line-height:1.15!important}\n#nerdWall .bulldog-slide.slide-0>.nerd-module .nerd-row{min-height:25px!important;font-size:14px!important}\n#nerdWall .bulldog-slide.slide-1>.nerd-module .nerd-row{font-size:11px!important;min-height:19px!important}\n#nerdWall .bulldog-slide.slide-1>.nerd-module:nth-child(-n+2) .nerd-row{min-height:27px!important}\n#nerdWall .bulldog-slide>.nerd-module .nerd-row[hidden]{display:none!important}\n#nerdWall .bulldog-more{font:10px system-ui;color:#a0e9d7;padding-top:4px}\n";style.textContent+="\n#nerdWall .bulldog-slide>.nerd-module .nerd-row{min-height:0!important;font-size:11px!important;line-height:1.05!important;padding:1px 0!important}\n#nerdWall .bulldog-slide>.nerd-module .nerd-row b,#nerdWall .bulldog-slide>.nerd-module .nerd-row>span:nth-child(2){line-height:1.05!important}\n#nerdWall .bulldog-slide.slide-0>.nerd-module .nerd-row{min-height:23px!important;font-size:14px!important}\n#nerdWall .bulldog-slide.slide-1>.nerd-module:nth-child(-n+2) .nerd-row{min-height:23px!important;font-size:10px!important}\n#nerdWall .bulldog-slide.slide-1>.nerd-module:nth-child(n+3) .nerd-row{min-height:17px!important;font-size:10px!important}\n#nerdWall .bulldog-slide.slide-2>.nerd-module .nerd-row{min-height:12px!important;font-size:10px!important}\n#nerdWall .bulldog-slide.slide-2>.nerd-module h3{margin-bottom:3px!important;padding-bottom:3px!important;font-size:12px!important}\n#nerdWall .bulldog-slide.slide-2>.nerd-module{padding:5px 8px!important}\n#nerdWall .bulldog-slide>.nerd-module .nerd-row b,#nerdWall .bulldog-slide>.nerd-module .nerd-row>span:nth-child(2){overflow:visible!important;text-overflow:clip!important}\n";style.textContent+="\n#nerdWall .bulldog-slide{display:grid!important;visibility:hidden!important;pointer-events:none!important}#nerdWall .bulldog-slide.show{visibility:visible!important}";doc.head.append(style);
const cards=[...wall.children].filter(x=>x.classList.contains('nerd-module')),seen=new Set();
const slides=groups.map((g,i)=>{const slide=doc.createElement('section');slide.className='bulldog-slide slide-'+i;slide.setAttribute('aria-label',chapters[i]);
for(const name of g){const p=cards.find(x=>x.getAttribute('aria-label')===name||(name==='AUDIO · PIONEER'&&x.getAttribute('aria-label')?.startsWith(name)));if(p){slide.append(p);seen.add(p)}}
wall.append(slide);return slide;});
for(const c of cards)if(!seen.has(c))c.hidden=true;
installed=true;ready=false;show(0);$('loading').hidden=false;inspect();
}catch(_){$('loading').textContent='Presentation unavailable; original Heartbeat unchanged';$('info').textContent='Could not read Nerd Central on this host';}}
function ecgSet(state,label,stamp){const e=document.getElementById('ecgStrap');if(!e)return;e.dataset.state=state;if(stamp)e.dataset.stamp=String(stamp);if(document.getElementById('ecgText').textContent!==label)document.getElementById('ecgText').textContent=label;e.setAttribute('aria-label','Bulldog health: '+label);}function inspect(){if(!installed)return;try{const d=frame.contentDocument;const source=d.getElementById('ecgStrap');if(source){const stamp=Number(source.dataset.stamp||0);const stale=stamp&&Date.now()-stamp>210000;ecgSet(stale&&source.dataset.state!=='down'?'warning':source.dataset.state,stale&&source.dataset.state!=='down'?'DATA STALE':d.getElementById('ecgText')?.textContent||'AWAITING DATA',stamp);}const health=d.getElementById('health')?.textContent||'';const populated=[...d.querySelectorAll('.bulldog-slide .nerd-rows')].every(el=>el.children.length>0&&!el.textContent.includes('Checking data'));if(!ready&&populated&&/HTTP responses/.test(health)){ready=true;nextRotation=Date.now()+30000;$('loading').hidden=true;}
const alerts=[...d.querySelectorAll('#alertsList .alert-item')].map(x=>x.textContent.replace(/^\s*●\s*/,'').trim()).filter(Boolean);
$('alerts').textContent=alerts.length?alerts.join('  ·  '):(d.getElementById('alertCount')?.textContent||'SCANNING');
$('info').textContent=(d.getElementById('health')?.textContent||'Checking live devices')+' · same Nerd Central source';}catch(_){}}
frame.addEventListener('load',install);
for(const ev of ['pointerdown','click','touchstart','contextmenu'])document.addEventListener(ev,e=>{e.preventDefault();e.stopImmediatePropagation()},{capture:true,passive:false});
clock();setInterval(clock,10000);setInterval(()=>{if(ready&&Date.now()>=nextRotation){show(active+1);nextRotation=Date.now()+30000}},1000);setInterval(inspect,3000);
})();
</script></body></html>
