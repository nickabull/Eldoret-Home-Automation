<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sky Q · Eldoret Home Automation</title><link rel="stylesheet" href="styles.css?v=7"></head>
<body><header><div><p class="eyebrow">ELDORET</p><h1>Home Automation</h1><p class="sub">Touch-first home control</p></div><div class="status"><span></span>Local connector</div></header>
<main>
<section class="hero"><div><h2>Sky Q</h2><p>Touch remote for the Sky Q box on your home network.</p></div><div class="stats"><b>1</b><small>Sky Q box</small><b>LAN</b><small>local control</small></div></section>
<nav class="tabs" aria-label="Area"><a href="index.html">All</a><a href="house.html">House</a><a href="utility.html">Utility / Outside</a><a class="active" href="sky.html">Sky Q</a></nav>

<section class="sky-remote-shell">
  <div class="sky-remote-status">
    <div><p class="eyebrow">SKY Q · 10.0.0.18</p><h2>Remote control</h2><p id="skyRemoteStatus">Ready</p></div>
    <button type="button" class="sky-key sky-power" data-sky-key="power">⏻<span>Power</span></button>
  </div>

  <div class="sky-quick">
    <button type="button" class="sky-key wide" data-sky-key="home">⌂<span>Home</span></button>
    <button type="button" class="sky-key wide" data-sky-key="search">⌕<span>Search</span></button>
    <button type="button" class="sky-key wide" data-sky-key="backup">↩<span>Back</span></button>
  </div>

  <div class="sky-navpad" aria-label="Sky navigation">
    <button type="button" class="sky-key nav-up" data-sky-key="up">▲</button>
    <button type="button" class="sky-key nav-left" data-sky-key="left">◀</button>
    <button type="button" class="sky-key nav-select" data-sky-key="select">OK</button>
    <button type="button" class="sky-key nav-right" data-sky-key="right">▶</button>
    <button type="button" class="sky-key nav-down" data-sky-key="down">▼</button>
  </div>

  <div class="sky-playback">
    <button type="button" class="sky-key" data-sky-key="rewind">⏪<span>Rewind</span></button>
    <button type="button" class="sky-key" data-sky-key="play">▶<span>Play</span></button>
    <button type="button" class="sky-key" data-sky-key="pause">Ⅱ<span>Pause</span></button>
    <button type="button" class="sky-key" data-sky-key="fastforward">⏩<span>Forward</span></button>
    <button type="button" class="sky-key record" data-sky-key="record">●<span>Record</span></button>
  </div>

  <div class="sky-channel-row">
    <button type="button" class="sky-key wide" data-sky-key="channeldown">CH −</button>
    <button type="button" class="sky-key wide" data-sky-key="channelup">CH +</button>
  </div>

  <div class="sky-numpad" aria-label="Number pad">
    <button type="button" class="sky-key" data-sky-key="1">1</button><button type="button" class="sky-key" data-sky-key="2">2</button><button type="button" class="sky-key" data-sky-key="3">3</button>
    <button type="button" class="sky-key" data-sky-key="4">4</button><button type="button" class="sky-key" data-sky-key="5">5</button><button type="button" class="sky-key" data-sky-key="6">6</button>
    <button type="button" class="sky-key" data-sky-key="7">7</button><button type="button" class="sky-key" data-sky-key="8">8</button><button type="button" class="sky-key" data-sky-key="9">9</button>
    <button type="button" class="sky-key zero" data-sky-key="0">0</button>
  </div>
</section>
</main>
<script src="sky.js?v=7"></script>
</body></html>
