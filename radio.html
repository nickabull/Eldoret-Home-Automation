.radio-page .radio-player{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;margin:14px 0 24px;min-width:0}
.radio-page .radio-now{display:grid;grid-template-columns:72px minmax(0,1fr) auto;align-items:center;gap:18px;min-width:0;padding:22px;border:1px solid #ffffff20;border-radius:24px;background:linear-gradient(145deg,#19283de8,#101a2be6);box-shadow:0 16px 36px #0003}
.radio-page .radio-now-logo{width:72px;height:72px;display:grid;place-items:center;border-radius:19px;background:linear-gradient(145deg,#26394f,#162438);overflow:hidden;flex-shrink:0}
.radio-page .radio-now-logo svg{width:38px;height:38px;fill:none;stroke:#c5f5e6;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.radio-page .radio-now-logo img{width:80%;height:80%;object-fit:contain}
.radio-page .radio-copy{min-width:0}.radio-page .radio-copy h2{font-size:clamp(22px,2.4vw,36px);line-height:1.15;margin:6px 0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.radio-page #radioNowMeta{font-size:13px;line-height:1.4;margin:0;color:#acbbcd;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.radio-page .radio-state{border:1px solid #73d5b14a;background:#173c31a6;color:#adebd5;border-radius:999px;padding:8px 13px;font-weight:800;letter-spacing:.12em;font-size:10px;white-space:nowrap}
.radio-page .radio-state[data-state="ERROR"]{border-color:#ff74744d;background:#422332;color:#ffb6bd}
.radio-page .radio-transport{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;min-width:0;padding:12px;border:1px solid #ffffff16;border-radius:24px;background:linear-gradient(145deg,#172332ed,#0b1420ed);box-shadow:0 12px 32px #0003}
.radio-page .radio-transport button,.radio-page .radio-pagination button{appearance:none;-webkit-appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:0;min-height:80px;padding:12px 6px;border:1px solid #ffffff19;border-radius:16px;background:linear-gradient(160deg,#26374a,#192635);color:#edf4fc;box-shadow:inset 0 1px 0 #ffffff09,0 3px 8px #0002;touch-action:manipulation;cursor:pointer;transition:transform .12s,border-color .12s}
.radio-page .radio-transport button svg{width:30px;height:30px;fill:currentColor}.radio-page .radio-transport button span{font-size:11px;font-weight:650;letter-spacing:.02em;color:#c4d1e0;line-height:1.2}
.radio-page #radioPlayPause{background:linear-gradient(145deg,#245c51,#173c37);border-color:#73d5b13b}.radio-page #radioPlayPause span{color:#d6f9ed}
.radio-page button:active:not(:disabled){transform:scale(.97);border-color:#73d5b1}.radio-page button:focus-visible{outline:2px solid #73d5b1;outline-offset:3px}.radio-page button:disabled{opacity:.4;cursor:default}
.radio-page .radio-heading{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:14px}.radio-page .radio-heading h2{font-size:30px;margin:3px 0 0;line-height:1.1}
.radio-page .radio-pagination{display:flex;align-items:center;gap:12px}.radio-page .radio-pagination button{width:46px;min-height:42px;height:42px;padding:8px;border-radius:13px}.radio-page .radio-pagination svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.radio-page #radioPageLabel{min-width:42px;text-align:center;color:#c2ccda;font-size:12px}
.radio-page .radio-station-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;min-width:0}
.radio-page .radio-station{appearance:none;display:flex;flex-direction:column;align-items:stretch;gap:10px;min-width:0;min-height:175px;height:auto!important;padding:18px!important;border:1px solid #ffffff21;border-radius:22px;text-align:left;color:#f4f7fb;background:linear-gradient(145deg,#19283de8,#101a2be8);box-shadow:0 12px 30px #0002;cursor:pointer;touch-action:manipulation}
.radio-page .radio-station[aria-pressed="true"]{border-color:#73d5b1;box-shadow:0 0 0 2px #73d5b11c,0 12px 30px #0003;background:linear-gradient(145deg,#1c3d3de8,#122531e8)}
.radio-page .radio-station-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.radio-page .radio-logo-tile{width:64px;height:52px;display:grid;place-items:center;border-radius:12px;background:#ffffffee;padding:7px;overflow:hidden}.radio-page .radio-logo-tile img{display:block;width:100%;height:100%;object-fit:contain}.radio-page .radio-logo-tile svg{width:30px;height:30px;fill:none;stroke:#345369;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.radio-page .radio-station strong{font-size:18px;line-height:1.2;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em}
.radio-page .radio-live-mark{font-size:9px;letter-spacing:.1em;color:#73d5b1;font-weight:800;white-space:nowrap}.radio-page .radio-station-tags{font-size:11px;color:#acbbcd;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.radio-page .radio-station-footer{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:650;color:#d6e5ef}.radio-page .radio-station-footer svg{width:12px;height:12px;fill:#73d5b1}.radio-page .radio-empty{grid-column:1/-1;padding:28px;border:1px solid #ffffff20;border-radius:20px;background:#142033e8;color:#c2ccda}
@media(min-width:1000px) and (orientation:landscape){
 .radio-page .radio-player{margin:8px 0 14px;grid-template-columns:minmax(0,1fr) 280px;gap:12px}
 .radio-page .radio-now{padding:16px 18px;gap:16px;border-radius:20px;grid-template-columns:62px minmax(0,1fr) auto}.radio-page .radio-now-logo{width:62px;height:62px;border-radius:16px}
 .radio-page .radio-copy h2{font-size:clamp(24px,2vw,36px)}.radio-page .radio-copy .eyebrow{font-size:9px}
 .radio-page .radio-transport{padding:10px;border-radius:20px}.radio-page .radio-transport button{min-height:76px;padding:8px 5px}
 .radio-page .radio-heading{margin-bottom:10px}.radio-page .radio-heading h2{font-size:24px}.radio-page .radio-heading .eyebrow{font-size:9px}
 .radio-page .radio-station-grid{gap:12px}.radio-page .radio-station{min-height:0;height:clamp(142px,20.4dvh,220px)!important;padding:14px!important;gap:6px;border-radius:18px}.radio-page .radio-logo-tile{height:42px;width:60px;padding:6px}.radio-page .radio-station strong{font-size:16px}.radio-page .radio-station-tags{font-size:10px}.radio-page .radio-station-footer{font-size:10px}
