<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Televisions 1.0 · Eldoret</title><style>*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;color:#f3fbff;background:#061420;font:15px/1.35 system-ui,-apple-system,sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-2;background:var(--art) center/cover no-repeat}body:after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(90deg,#041423c4,#04142330)}header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:#061b2cce;border-bottom:1px solid #70b9ca66}header strong{font-size:20px;letter-spacing:.08em}header small{display:block;color:#bde2eb;font-size:10px;letter-spacing:.15em}.tools{display:flex;gap:8px;flex-wrap:wrap}button,a{font:inherit;color:inherit}button,.tools a{padding:10px 14px;border:1px solid #6bafc4;border-radius:9px;background:#18576c;color:white;text-decoration:none;font-weight:800;cursor:pointer}main{max-width:1500px;margin:auto;padding:16px 18px}h1{font-size:clamp(20px,3vw,34px);margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{min-height:100px;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:14px;border:1px solid #79bdd080;border-radius:12px;background:#09293dba;text-decoration:none;backdrop-filter:blur(3px)}.tile strong{font-size:clamp(15px,2vw,22px)}.tile small{color:#d1e7ed}.tile:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #ffd858}#status{font-size:12px;color:#d1e7ed;margin:10px 0}@media(display-mode:standalone){header{padding-top:max(30px,calc(env(safe-area-inset-top,0px) + 8px))}}@media(max-width:650px){header{flex-wrap:wrap;padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}main{padding:12px}.tile{min-height:85px;padding:10px}.tools a,button{font-size:12px}}</style></head><body style="--art:url('/eldoret-televisions.jpg')"><header><div><strong>ELDORET · TELEVISIONS 1.0</strong><small>SELECT ROOM</small></div><div class="tools"><button id="refresh">↻ REFRESH</button><a href="nerd-control.html">⌂ NERD CENTRAL</a></div></header><main><h1>Which television?</h1><div class="grid"><a class="tile" href="tv-room-v11.html?room=lounge" data-id="lounge"><strong>Lounge TV</strong><small>Checking status…</small></a><a class="tile" href="tv-room-v11.html?room=kitchen" data-id="kitchen"><strong>Kitchen TV</strong><small>Checking status…</small></a><a class="tile" href="tv-room-v11.html?room=pit" data-id="pit"><strong>Pit TV</strong><small>Checking status…</small></a><a class="tile" href="tv-room-v11.html?room=bedroom" data-id="bedroom"><strong>Main bedroom TV</strong><small>Checking status…</small></a><a class="tile" href="tv-room-v11.html?room=jesse" data-id="jesse"><strong>Jesse's TV</strong><small>Checking status…</small></a><a class="tile" href="tv-room-v11.html?room=ella" data-id="ella"><strong>Ella's TV</strong><small>Checking status…</small></a><a class="tile" href="tv-room-v11.html?room=thea" data-id="thea"><strong>Thea's TV</strong><small>Checking status…</small></a></div><p id="status" role="status"></p></main><script>
const tiles=[...document.querySelectorAll('.tile')];let busy=false;async function refresh(){if(busy)return;busy=true;document.getElementById('refresh').disabled=true;try{await Promise.all(tiles.map(async t=>{try{const room=t.dataset.id;const r=await fetch(room==='lounge'?'/api/lg/control-status':room==='kitchen'?'/api/lg/kitchen/status':'/api/lg/room/'+room+'/status',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();t.querySelector('small').textContent=d.paired?'Paired · power not checked':'Not paired / unavailable'}catch(_){t.querySelector('small').textContent='Status unavailable'}}));document.getElementById('status').textContent='Checked '+new Date().toLocaleTimeString('en-GB')}catch(_){document.getElementById('status').textContent='Status unavailable'}finally{busy=false;document.getElementById('refresh').disabled=false}}document.getElementById('refresh').onclick=refresh;refresh();
</script><script src="kiosk.js?v=3"></script></body></html>
