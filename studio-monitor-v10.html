<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eldoret · Studio & Audio 1.0</title><style>
*{box-sizing:border-box}body{margin:0;background:#071722;color:#e7f5f8;font:14px system-ui,sans-serif}main{height:100dvh;overflow:hidden;padding:12px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;background:linear-gradient(90deg,#071722ed,#071722a0),url('/eldoret-audio.jpg') center/cover}header,nav,footer{display:flex;align-items:center;gap:12px;justify-content:space-between}h1{font-size:22px;margin:0;color:#9ce7d7}a{color:#a5e6d8}button{font:inherit;color:#def5ef;background:#123341;border:1px solid #416c76;border-radius:5px;padding:7px 12px}button[aria-pressed=true]{background:#23685e}nav{justify-content:flex-start;flex-wrap:wrap}.bank{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;min-height:0}.strip{background:#0a2030dc;border:1px solid #355666;border-radius:6px;padding:6px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:5px;text-align:center;min-width:0;min-height:0}.name{overflow-wrap:anywhere;font-weight:700;color:#a5e6d8;font-size:12px}.track{width:8px;height:100%;min-height:0;background:#39505c;border-radius:4px;position:relative;margin:auto}.knob{position:absolute;left:50%;width:24px;height:12px;border-radius:3px;background:#ced8dc;border:1px solid #647c86;transform:translate(-50%,50%)}.state{font-size:11px;color:#b6c9cf}.muted{color:#ffb1a4}.on{color:#9de4c2}footer{font-size:11px;color:#b4cbd1}#summary{color:#e7cd9f;font-size:12px}#meta{font-size:12px;color:#adc5cf}@media(max-width:600px){main{padding:5px;gap:5px}h1{font-size:16px}nav{gap:4px}button{padding:4px;font-size:11px}.bank{gap:3px}.strip{padding:3px}.name,.state{font-size:9px}.knob{width:16px}}
</style></head><body><main><header><div><h1>ELDORET · STUDIO & AUDIO</h1><div id="meta">Connecting to studio telemetry…</div></div><a href="/nerd-control.html">← Nerd Central</a></header><nav id="banks" aria-label="Mixer banks"></nav><section id="bank" class="bank" aria-label="Read-only mixer fader positions"></section><footer><span id="summary">READ ONLY · No mixer commands</span><span id="stamp">Awaiting sample</span></footer></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let sample=null,selected=0,busy=false;const banks=[['CH 1–8','channels',0],['CH 9–16','channels',8],['CH 17–24','channels',16],['CH 25–32','channels',24],['BUS 1–8','buses',0],['BUS 9–16','buses',8],['DCA','dcas',0],['MAIN','main',0]];const strips=[];
function set(el,v){v=String(v);if(el.textContent!==v)el.textContent=v}
banks.forEach((b,i)=>{const e=document.createElement('button');e.textContent=b[0];e.type='button';e.addEventListener('click',()=>{selected=i;draw()});$('banks').append(e)});
for(let i=0;i<8;i++){const el=document.createElement('article');el.className='strip';el.innerHTML='<div class="number"></div><div class="name"></div><div class="track"><div class="knob" hidden></div></div><div class="value"></div><div class="state"></div>';$('bank').append(el);strips.push(el)}
function draw(){const [,kind,start]=banks[selected];[...$('banks').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===selected)));const values=kind==='main'?[sample?.main]:sample?.[kind]||[];strips.forEach((el,i)=>{el.style.visibility=kind==='main'&&i>0?'hidden':'visible';const d=values[kind==='main'?0:start+i]||{};set(el.children[0],kind==='main'?'MAIN LR':kind.toUpperCase()+' '+(start+i+1));set(el.children[1],d.name||'—');const k=el.children[2].firstElementChild;const valid=typeof d.fader==='number'&&Number.isFinite(d.fader)&&d.fader>=0&&d.fader<=1;k.hidden=!valid;if(valid)k.style.bottom=(d.fader*100)+'%';set(el.children[3],valid?Math.round(d.fader*100)+'% position':'—');const st=el.children[4];set(st,d.on===1?'ON':d.on===0?'MUTED':'UNKNOWN');st.className='state '+(d.on===1?'on':d.on===0?'muted':'')});if(sample){set($('meta'),(sample.model||'X32 Rack')+' · '+(sample.firmware?'FW '+sample.firmware:'firmware unknown')+' · '+(sample.available?'RESPONDING':sample.stale?'LAST KNOWN':'READING UNAVAILABLE')+' · X-Touch '+(sample.xtouch?.reachable===true?'ON LAN':sample.xtouch?.reachable===false?'NO REPLY':'UNKNOWN'));set($('stamp'),sample.checked_at?'Sample '+new Date(sample.checked_at).toLocaleTimeString('en-GB'):'Awaiting sample')}}
async function refresh(){if(busy||document.hidden)return;busy=true;try{const r=await fetch('/api/studio/status',{cache:'no-store'});if(!r.ok)throw Error('HTTP');const p=await r.json();if(!p.sampling){sample=p;draw()}}catch(e){set($('meta'),'Telemetry unavailable · retaining last displayed sample')}finally{busy=false}}
draw();refresh();setInterval(refresh,120000);
})();</script></body></html>
